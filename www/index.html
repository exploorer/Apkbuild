<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f0c29">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Прыгун</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --accent:#7bf1ff;
    --accent2:#a78bfa;
    --bg0:#0d0a24;
    --bg1:#241d4d;
    --bg2:#160f33;
  }
  html,body{
    width:100%;height:100%;overflow:hidden;background:var(--bg0);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none;
    position:fixed;color:#fff;
  }
  #game{position:fixed;inset:0;width:100%;height:100%;display:block}

  /* ============ HUD ============ */
  .hud{
    position:fixed;top:0;left:0;right:0;z-index:5;
    padding:calc(env(safe-area-inset-top,0px) + 16px) 22px 0;
    display:flex;justify-content:space-between;align-items:flex-start;
    pointer-events:none;
  }
  .score{
    font-size:46px;font-weight:900;letter-spacing:-2px;line-height:1;
    font-variant-numeric:tabular-nums;
    background:linear-gradient(180deg,#fff,var(--accent));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 3px 10px rgba(90,170,255,.55));
  }
  .best{
    text-align:right;font-size:12px;font-weight:800;letter-spacing:1.5px;
    text-transform:uppercase;opacity:.55;padding-top:6px;
  }
  .best b{display:block;font-size:20px;letter-spacing:-.5px;opacity:1;margin-top:2px}

  /* ============ OVERLAYS ============ */
  .overlay{
    position:fixed;inset:0;z-index:10;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;padding:24px;text-align:center;
    background:radial-gradient(circle at 50% 42%,rgba(70,60,140,.55),rgba(12,10,35,.94) 70%);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    transition:opacity .3s ease,visibility .3s ease;
  }
  .overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}
  .overlay.modal{z-index:20;background:rgba(8,6,20,.92)}
  .overlay.modal .panel{
    width:100%;max-width:520px;max-height:86vh;overflow-y:auto;
    background:linear-gradient(180deg,rgba(40,30,70,.95),rgba(20,15,40,.95));
    border:1px solid rgba(255,255,255,.1);
    border-radius:26px;padding:20px;
    -webkit-overflow-scrolling:touch;
  }
  .overlay.modal .panel::-webkit-scrollbar{width:0}

  /* ============ TEXT ============ */
  .title{
    font-size:clamp(38px,13vw,56px);font-weight:900;letter-spacing:-2.5px;line-height:1;
    background:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 6px 24px rgba(140,120,255,.45));
  }
  .sub{font-size:15px;line-height:1.6;opacity:.65;max-width:300px}
  .sub kbd{background:rgba(255,255,255,.12);border-radius:6px;padding:2px 7px;font-family:inherit;font-size:13px;font-weight:700}

  /* ============ STATS ROW ============ */
  .stat{display:flex;gap:34px;margin:4px 0}
  .stat > div{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;opacity:.5;font-weight:800}
  .stat b{
    display:block;font-size:34px;letter-spacing:-1px;opacity:1;margin-top:4px;
    background:linear-gradient(180deg,#fff,var(--accent));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .stat.coin b{background:linear-gradient(180deg,#fff7cc,#ffd166);-webkit-background-clip:text;background-clip:text;color:transparent}

  /* ============ BUTTONS ============ */
  .btn{
    pointer-events:auto;margin-top:6px;border:0;cursor:pointer;font-family:inherit;
    padding:17px 52px;border-radius:999px;font-size:18px;font-weight:900;letter-spacing:.3px;
    color:#0b1030;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 10px 30px rgba(123,241,255,.35),inset 0 0 0 1px rgba(255,255,255,.25);
    transition:transform .12s ease,box-shadow .12s ease;
  }
  .btn:active{transform:scale(.94);box-shadow:0 4px 14px rgba(123,241,255,.3)}

  .icon-row{display:flex;gap:12px;margin-top:6px;pointer-events:auto}
  .icon-btn{
    display:flex;flex-direction:column;align-items:center;gap:5px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
    border-radius:18px;padding:12px 20px;color:#fff;font-family:inherit;
    cursor:pointer;transition:all .18s;
  }
  .icon-btn span{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;opacity:.7}
  .icon-btn .ico{font-size:22px;line-height:1}
  .icon-btn:active{transform:scale(.94);background:rgba(255,255,255,.13)}

  .badge{
    font-size:12px;font-weight:900;letter-spacing:2px;text-transform:uppercase;
    color:#0b1030;background:linear-gradient(135deg,#ffe066,#ffb020);
    padding:6px 16px;border-radius:999px;margin-top:4px;
    box-shadow:0 6px 18px rgba(255,190,50,.4);
    animation:pop .45s cubic-bezier(.2,1.6,.4,1);
  }
  @keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}

  /* ============ MODAL HEADER ============ */
  .panel-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
  .close-btn{
    width:38px;height:38px;border-radius:50%;flex-shrink:0;
    background:rgba(255,255,255,.1);border:0;color:#fff;font-size:16px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:all .15s;
  }
  .close-btn:active{transform:scale(.9);background:rgba(255,255,255,.2)}
  .panel-title{font-size:22px;font-weight:900;letter-spacing:-.5px;flex:1;text-align:center}
  .coins-badge{
    font-size:13px;font-weight:800;flex-shrink:0;
    background:rgba(255,209,102,.15);color:#ffd166;
    padding:8px 14px;border-radius:999px;
    display:flex;align-items:center;gap:4px;
    border:1px solid rgba(255,209,102,.2);
  }
  .coins-badge b{font-size:15px}

  /* ============ SKINS GRID ============ */
  .skins-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));
    gap:10px;
  }
  .skin-card{
    background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.08);
    border-radius:18px;padding:12px 8px 10px;
    display:flex;flex-direction:column;align-items:center;gap:7px;
    cursor:pointer;transition:all .18s ease;position:relative;overflow:hidden;
  }
  .skin-card:active{transform:scale(.95)}
  .skin-card.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 22px rgba(123,241,255,.25)}
  .skin-card.locked{opacity:.75}
  .skin-preview{
    width:52px;height:52px;border-radius:50%;flex-shrink:0;
    transition:transform .2s;
  }
  .skin-name{font-size:12px;font-weight:800;letter-spacing:-.2px;text-align:center;line-height:1.15}
  .skin-status{
    font-size:10px;font-weight:900;letter-spacing:1px;text-transform:uppercase;
    color:rgba(255,255,255,.5);
  }
  .skin-status.price{color:#ffd166;display:flex;align-items:center;gap:2px}
  .skin-status.owned{color:var(--accent)}
  .skin-check{
    position:absolute;top:6px;right:6px;width:18px;height:18px;
    border-radius:50%;background:var(--accent);color:#0b1030;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:900;
  }
  .skin-card .rainbow-preview{
    background:conic-gradient(from 0deg,#ff5f6d,#ffc371,#7bf1ff,#a78bfa,#ff5f6d);
    animation:spin 4s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ============ SETTINGS ============ */
  .settings-section{margin-bottom:22px}
  .settings-section:last-child{margin-bottom:0}
  .section-title{
    font-size:11px;font-weight:900;letter-spacing:2px;text-transform:uppercase;
    opacity:.5;margin-bottom:12px;
  }
  .theme-grid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  .theme-swatch{
    width:46px;height:46px;border-radius:50%;
    border:2px solid transparent;cursor:pointer;
    transition:all .18s;position:relative;flex-shrink:0;
  }
  .theme-swatch:active{transform:scale(.9)}
  .theme-swatch.selected{
    border-color:#fff;
    box-shadow:0 0 0 2px rgba(255,255,255,.25),0 0 18px rgba(255,255,255,.4);
  }

  .toggle-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;background:rgba(255,255,255,.04);
    border-radius:14px;margin-bottom:8px;
  }
  .toggle-row:last-child{margin-bottom:0}
  .toggle-row span{font-size:15px;font-weight:700}
  .toggle{
    width:50px;height:30px;flex-shrink:0;
    background:rgba(255,255,255,.15);border:0;border-radius:999px;
    position:relative;cursor:pointer;transition:background .2s;
  }
  .toggle::after{
    content:'';position:absolute;top:3px;left:3px;
    width:24px;height:24px;border-radius:50%;background:#fff;
    transition:transform .2s cubic-bezier(.4,1.6,.6,1);
    box-shadow:0 1px 4px rgba(0,0,0,.3);
  }
  .toggle.on{background:var(--accent)}
  .toggle.on::after{transform:translateX(20px)}

  .reset-btn{
    width:100%;padding:14px;border-radius:14px;
    background:rgba(255,80,80,.12);color:#ff8888;
    border:1px solid rgba(255,80,80,.25);
    font-family:inherit;font-size:14px;font-weight:800;
    cursor:pointer;transition:all .18s;
  }
  .reset-btn:active{transform:scale(.97);background:rgba(255,80,80,.22)}
  .reset-btn.confirm{background:rgba(255,60,60,.35);color:#fff;animation:pulse .5s infinite alternate}
  @keyframes pulse{from{opacity:.85}to{opacity:1}}

  /* ============ TOAST ============ */
  .toast{
    position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 30px);
    left:50%;transform:translateX(-50%) translateY(20px);
    background:rgba(30,20,60,.95);border:1px solid rgba(255,255,255,.15);
    color:#fff;padding:12px 22px;border-radius:999px;
    font-size:14px;font-weight:700;z-index:30;
    opacity:0;pointer-events:none;transition:all .3s ease;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    box-shadow:0 10px 30px rgba(0,0,0,.4);white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div class="hud">
  <div class="score" id="scoreEl">0</div>
  <div class="best">Рекорд<b id="bestEl">0</b></div>
</div>

<!-- ================= MAIN MENU ================= -->
<div class="overlay" id="startScreen">
  <div class="title">Прыгун</div>
  <div class="sub">Веди пальцем по экрану — герой летит за ним.<br>Прыгай по платформам как можно выше!</div>
  <div class="stat">
    <div>Рекорд<b id="menuBest">0</b></div>
    <div class="coin">Монеты<b id="menuCoins">0</b></div>
  </div>
  <button class="btn" id="playBtn">Играть</button>
  <div class="icon-row">
    <button class="icon-btn" id="startSkinsBtn"><span class="ico">🎨</span><span>Скины</span></button>
    <button class="icon-btn" id="startSettingsBtn"><span class="ico">⚙️</span><span>Настройки</span></button>
  </div>
</div>

<!-- ================= GAME OVER ================= -->
<div class="overlay hidden" id="overScreen">
  <div class="sub" style="letter-spacing:3px;text-transform:uppercase;font-weight:800;opacity:.4;font-size:12px">Игра окончена</div>
  <div class="stat">
    <div>Очки<b id="finalScore">0</b></div>
    <div>Рекорд<b id="finalBest">0</b></div>
  </div>
  <div class="stat coin" style="margin-top:-8px">
    <div>Монет<b id="finalCoins">+0</b></div>
  </div>
  <div class="badge" id="newBest" style="display:none">Новый рекорд!</div>
  <button class="btn" id="againBtn">Ещё раз</button>
  <div class="icon-row">
    <button class="icon-btn" id="overSkinsBtn"><span class="ico">🎨</span><span>Скины</span></button>
    <button class="icon-btn" id="overMenuBtn"><span class="ico">🏠</span><span>Меню</span></button>
  </div>
</div>

<!-- ================= SKINS ================= -->
<div class="overlay modal hidden" id="skinsScreen">
  <div class="panel">
    <div class="panel-header">
      <button class="close-btn" id="closeSkins">✕</button>
      <div class="panel-title">Скины</div>
      <div class="coins-badge">🪙 <b id="skinCoins">0</b></div>
    </div>
    <div class="skins-grid" id="skinsGrid"></div>
  </div>
</div>

<!-- ================= SETTINGS ================= -->
<div class="overlay modal hidden" id="settingsScreen">
  <div class="panel">
    <div class="panel-header">
      <button class="close-btn" id="closeSettings">✕</button>
      <div class="panel-title">Настройки</div>
      <div style="width:38px"></div>
    </div>

    <div class="settings-section">
      <div class="section-title">Тема оформления</div>
      <div class="theme-grid" id="themeGrid"></div>
    </div>

    <div class="settings-section">
      <div class="section-title">Звук и эффекты</div>
      <div class="toggle-row">
        <span>🔊 Звук</span>
        <button class="toggle" id="toggleSound"></button>
      </div>
      <div class="toggle-row">
        <span>✨ Частицы</span>
        <button class="toggle" id="toggleParticles"></button>
      </div>
      <div class="toggle-row">
        <span>📳 Вибрация</span>
        <button class="toggle" id="toggleHaptics"></button>
      </div>
    </div>

    <div class="settings-section">
      <div class="section-title">Прогресс</div>
      <button class="reset-btn" id="resetBtn">Сбросить прогресс</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

/* ============================================================
   КАНВАС
============================================================ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
let W = 0, H = 0, DPR = 1, bgGrad = null;

/* ============================================================
   ДАННЫЕ
============================================================ */
const SAVE_KEY = 'jumper_save_v2';

const SKINS = {
  classic: { name:'Классика', price:0,    c:['#fff7d6','#ffd166','#f08a00'], glow:'255,190,80' },
  ice:     { name:'Лёд',      price:100,  c:['#e0f7ff','#7ee0ff','#2b8fe0'], glow:'126,224,255' },
  fire:    { name:'Огонь',    price:200,  c:['#ffe6b0','#ff8c42','#e8380d'], glow:'255,120,60' },
  nature:  { name:'Природа',  price:300,  c:['#e8ffd6','#8bff9d','#2bb05a'], glow:'120,255,160' },
  pink:    { name:'Розовый',  price:400,  c:['#ffe6f2','#f472b6','#be185d'], glow:'244,114,182' },
  galaxy:  { name:'Галактика',price:500,  c:['#f0e6ff','#a78bfa','#5b21b6'], glow:'167,139,250' },
  gold:    { name:'Золото',   price:800,  c:['#fffbe6','#ffd700','#b8860b'], glow:'255,215,0' },
  neon:    { name:'Неон',     price:1000, c:['#e0fff4','#00ffaa','#00b37e'], glow:'0,255,170' },
  ghost:   { name:'Призрак',  price:1200, c:['rgba(230,240,255,.4)','rgba(180,200,255,.55)','rgba(120,150,220,.45)'], glow:'200,220,255' },
  rainbow: { name:'Радуга',   price:1500, rainbow:true, glow:'255,255,255' }
};

const THEMES = {
  midnight: { name:'Полночь',   bg:['#0d0a24','#241d4d','#160f33'], accent:'#7bf1ff', accent2:'#a78bfa' },
  sunset:   { name:'Закат',     bg:['#2d0a1e','#6e2b3f','#1f0a14'], accent:'#ff8c42', accent2:'#ff2e63' },
  forest:   { name:'Лес',       bg:['#0a1f0f','#1a4d2b','#0a170e'], accent:'#8bff9d', accent2:'#2bb05a' },
  ocean:    { name:'Океан',     bg:['#0a1828','#1a3d5c','#08121f'], accent:'#7ee0ff', accent2:'#2b8fe0' },
  cyber:    { name:'Киберпанк', bg:['#1a0028','#3d0a4d','#0d001a'], accent:'#ff2eb8', accent2:'#7b2eff' },
  candy:    { name:'Конфета',   bg:['#2a0e2b','#5e2050','#1a0818'], accent:'#f9a8d4', accent2:'#c084fc' },
  mono:     { name:'Моно',      bg:['#0a0a0a','#2a2a2a','#0a0a0a'], accent:'#ffffff', accent2:'#888888' }
};

let save = {
  best: 0,
  coins: 0,
  ownedSkins: ['classic'],
  skin: 'classic',
  theme: 'midnight',
  sound: true,
  particles: true,
  haptics: true
};

function loadSave(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw){
      const s = JSON.parse(raw);
      save = Object.assign(save, s);
      if (!Array.isArray(save.ownedSkins) || save.ownedSkins.indexOf('classic') < 0){
        save.ownedSkins = ['classic'];
      }
    }
  } catch(e){}
  try {
    const oldBest = parseInt(localStorage.getItem('jumper_best') || '0', 10) || 0;
    if (oldBest > save.best) save.best = oldBest;
  } catch(e){}
}
function saveGame(){
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch(e){}
}
loadSave();

/* ============================================================
   ИГРОВЫЕ КОНСТАНТЫ
============================================================ */
const GRAVITY   = 1900;
const JUMP_V    = -790;
const SPRING_V  = -1330;
const MOVE      = 450;
const MAX_FALL  = 1700;
const PR        = 16;
const STEP      = 1 / 60;

/* ============================================================
   СОСТОЯНИЕ
============================================================ */
let player, platforms = [], coins = [], particles = [], stars = [], floatTexts = [];
let score = 0, scroll = 0, time = 0, shakeT = 0;
let running = false, over = false;
let touchX = null, activePointer = null;
let keys = { left:false, right:false };
let lastShown = -1;
let trailAcc = 0;
let startCoins = 0;
let returnScreen = 'menu';

/* ============================================================
   ЭЛЕМЕНТЫ DOM
============================================================ */
const scoreEl    = document.getElementById('scoreEl');
const bestEl     = document.getElementById('bestEl');
const startScr   = document.getElementById('startScreen');
const overScr    = document.getElementById('overScreen');
const skinsScr   = document.getElementById('skinsScreen');
const settingsScr= document.getElementById('settingsScreen');
const menuBest   = document.getElementById('menuBest');
const menuCoins  = document.getElementById('menuCoins');
const finalScoreEl = document.getElementById('finalScore');
const finalBestEl  = document.getElementById('finalBest');
const finalCoinsEl = document.getElementById('finalCoins');
const newBestEl    = document.getElementById('newBest');
const skinsGrid    = document.getElementById('skinsGrid');
const skinCoinsEl  = document.getElementById('skinCoins');
const themeGrid    = document.getElementById('themeGrid');
const toggleSound  = document.getElementById('toggleSound');
const toggleParticles = document.getElementById('toggleParticles');
const toggleHaptics= document.getElementById('toggleHaptics');
const resetBtn     = document.getElementById('resetBtn');
const toastEl      = document.getElementById('toast');

/* ============================================================
   ПРИМЕНЕНИЕ ТЕМЫ
============================================================ */
function applyTheme(){
  const t = THEMES[save.theme] || THEMES.midnight;
  document.documentElement.style.setProperty('--accent', t.accent);
  document.documentElement.style.setProperty('--accent2', t.accent2);
  document.documentElement.style.setProperty('--bg0', t.bg[0]);

  if (!bgGrad || true){
    bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, t.bg[0]);
    bgGrad.addColorStop(0.45, t.bg[1]);
    bgGrad.addColorStop(1, t.bg[2]);
  }
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', t.bg[0]);
}

/* ============================================================
   ЗВУК / ТАКТИЛЬНЫЙ ОТКЛИК
============================================================ */
let actx = null;
function initAudio(){
  if (actx) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) actx = new AC();
  } catch(e){ actx = null; }
}
function beep(freq, dur, type, vol, slideTo){
  if (!actx || !save.sound) return;
  try{
    const t = actx.currentTime;
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime
